name: Build OpenWrt 25 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package OpenWrt 25 APK
        run: |
          set -e
          PKG_NAME="luci-app-parentctrl"
          PKG_VER="1.0.0-r1"
          WORK_DIR="/tmp/apk_work"

          mkdir -p "${WORK_DIR}/control" "${WORK_DIR}/data" "${WORK_DIR}/out"

          # 1. Kopiowanie plików aplikacji do struktury danych
          cp -r package/luci-app-parentctrl/root/* "${WORK_DIR}/data/"

          # Wymuszenie poprawnych uprawnień uniksowych
          chmod 0755 "${WORK_DIR}/data/etc/init.d/parentctrl"
          chmod 0755 "${WORK_DIR}/data/usr/share/parentctrl/"*.uc

          # 2. Generowanie pliku metadanych APK (.PKGINFO)
          cat << 'PKGINFO' > "${WORK_DIR}/control/.PKGINFO"
          pkgname = luci-app-parentctrl
          pkgver = 1.0.0-r1
          pkgdesc = Advanced Parental Control with Screen Time Quota, DoH Blocking and Quarantine for OpenWrt 25
          url = https://github.com/yansenapdwyll/OpenWrt-Parental-Control
          builddate = 1730000000
          packager = GitHub Actions
          size = 131072
          arch = all
          license = GPL-3.0-or-later
          depend = luci-base firewall4 ucode ucode-mod-fs ucode-mod-uci ucode-mod-uloop ucode-mod-socket dnsmasq-full
PKGINFO

          # 3. Tworzenie archiwów składowych APK
          tar --numeric-owner --owner=0 --group=0 -czf "${WORK_DIR}/control.tar.gz" -C "${WORK_DIR}/control" .PKGINFO
          tar --numeric-owner --owner=0 --group=0 -czf "${WORK_DIR}/data.tar.gz" -C "${WORK_DIR}/data" .

          # 4. Łączenie w końcową paczkę .apk
          cat "${WORK_DIR}/control.tar.gz" "${WORK_DIR}/data.tar.gz" > "${WORK_DIR}/out/${PKG_NAME}-${PKG_VER}.apk"

      - name: Upload compiled APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-parentctrl-apk
          path: /tmp/apk_work/out/*.apk
